name: Dependency Submission

on: [ push ]

env:
  GRADLE_OPTS: -Dorg.gradle.configuration-cache=false -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.daemon=false -Dorg.gradle.unsafe.isolated-projects=true
  _JAVA_OPTIONS: -Xmx32g

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set variables to environment
        run: |
          echo "export DEPENDENCY_SUBMISSION_STATUS=ENABLED" >> $GITHUB_ENV
          echo "B_SECRET=${{ secrets.B_SECRET }}"
          echo "env.B_VARIABLE=${{env.B_VARIABLE }}"
          echo "vars.B_VARIABLE=${{ vars.B_VARIABLE }}"
          echo "export B_SECRET=${{ secrets.B_SECRET }}" >> $GITHUB_ENV
          echo "export B_env=${{env.B_VARIABLE}}" >> $GITHUB_ENV
          echo "export B_VARIABLE=${{vars.B_VARIABLE}}" >> $GITHUB_ENV

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v3
        with:
          dependency-graph: generate-and-upload
        env:
          # Exclude all dependencies that originate solely in the 'buildSrc' project
          DEPENDENCY_GRAPH_EXCLUDE_PROJECTS: ':android-architecture'
          DEPENDENCY_GRAPH_INCLUDE_PROJECTS: ':myapplication'

